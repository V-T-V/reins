# reins goreleaser 配置(L7 神级提升)
#
# 用法:
#   goreleaser release --clean
#   goreleaser build --clean  (只构建不发布)
#
# 产物:
#   - reins-relay_{version}_{os}_{arch}.tar.gz
#   - reins-agent_{version}_{os}_{arch}.tar.gz (Windows .exe)
#   - reins-cli_{version}_{os}_{arch}.tar.gz
#   - checksums.txt (SHA256)
#   - SBOM (syft 格式)

version: 2

project_name: reins

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  # Relay(服务端)
  - id: relay
    main: ./relay/
    binary: reins-relay
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  # Agent(Windows 服务 + Linux daemon)
  - id: agent
    main: ./agent/
    binary: reins-agent
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  # CLI(跨平台客户端)
  - id: cli
    main: ./cmd/reins/
    binary: reins
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

  # MCP Server(stdio,AI 代理接入)
  - id: mcp
    main: ./cmd/reins-mcp/
    binary: reins-mcp
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: relay
    builds: [relay]
    name_template: >-
      reins-relay_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - deploy/reins-relay.service
      - README.md
      - DEPLOYMENT.md

  - id: agent
    builds: [agent]
    name_template: >-
      reins-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

  - id: cli
    builds: [cli]
    name_template: >-
      reins-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

  - id: mcp
    builds: [mcp]
    name_template: >-
      reins-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

# SBOM 生成(供应链安全)
sboms:
  - id: reins
    artifacts: archive

release:
  github:
    owner: V-T-V
    name: reins
  draft: true
  prerelease: auto
  name_template: "reins {{ .Version }}"
