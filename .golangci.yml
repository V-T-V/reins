# go-rmm golangci-lint 配置（v2 schema）
#
# 背景：CI 的 build step 自仓库建立起就因二进制输出与源码目录撞名而必红，
# lint 从未真正执行过。2026-08-16 首次启用：本轮已清零 gofmt(130)/
# staticcheck(16)/bodyclose(12)/unconvert(3)/prealloc(2) 全部存量问题，
# 以下 linter 因存量问题量大（合计约 363 条）暂缓启用，建议按批消化后
# 从 disable 移回 enable：
#   - errcheck  104 条：未处理 error（多为 Close/Write 返回值）
#   - gocritic  155 条：风格/性能建议（0o755 八进制、http.NoBody、大结构体传值）
#   - revive     74 条：风格（未用参数命名 _、空块、内置名遮蔽 max）
#   - unused     23 条：疑似预留未接线代码（batchWriter/webhook notify* 等）
#   - nilerr      7 条：err 非 nil 仍返回 nil（多为刻意的"记录后继续"，需逐个确认语义）

version: "2"

run:
  go: "1.25"

linters:
  default: standard
  disable:
    - errcheck
    - gocritic
    - revive
    - unused
    - nilerr
  enable:
    - misspell
    - bodyclose
    - prealloc
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
