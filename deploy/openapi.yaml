# reins Relay API — OpenAPI 3.0 规范(L5 神级提升)
#
# 用途:
#   1. 生成 API 文档(Swagger UI / Redoc)
#   2. 自动生成客户端 SDK(多语言)
#   3. API 契约测试
#
# 在线查看:把此文件粘贴到 https://editor.swagger.io/

openapi: 3.0.3
info:
  title: reins Relay API
  description: |
    reins 远程自动化执行平台的 REST API。
    所有端点(除 /healthz)需 Authorization: Bearer <token>。
  version: 2.2.0
  contact:
    name: reins
    url: https://github.com/V-T-V/reins

servers:
  - url: http://localhost:7780
    description: 本地开发

security:
  - BearerAuth: []

paths:
  /healthz:
    get:
      summary: 健康检查
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  relay: { type: string }
                  store: { type: string }
                  agents: { type: integer }
                  uptime_s: { type: integer }

  /metrics:
    get:
      summary: Prometheus 指标
      security: []
      responses:
        "200":
          description: Prometheus text format

  /api/agents:
    get:
      summary: 列出在线 Agent
      responses:
        "200":
          description: Agent 列表(含 online_since 上线时刻毫秒戳与 xfer_stats 传输画像)
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
                  count: { type: integer }

  /api/tasks:
    post:
      summary: 下发任务
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "202":
          description: 任务已接受
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string }
                  agent_id: { type: string }

  /api/tasks/{taskID}:
    get:
      summary: 查询任务状态和结果
      parameters:
        - name: taskID
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 任务详情 + 结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/StoredTask" }
                  result: { $ref: "#/components/schemas/TaskResult" }

  /api/tasks:
    get:
      summary: 列出任务历史
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: 任务列表

  /api/tasks/cancel:
    post:
      summary: 取消任务
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task_id: { type: string }
                agent_id: { type: string }
      responses:
        "202": { description: 已取消 }

  /api/tasks/batch:
    post:
      summary: 按标签批量下发
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag: { type: string }
                type: { type: string }
                payload: { type: object }
                timeout: { type: integer }

  /api/transfer/upload:
    post:
      summary: 上传文件到 Agent
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }

  /api/transfer/download:
    post:
      summary: 从 Agent 下载文件
      parameters:
        - name: agent_id
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 文件流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/updates/latest:
    get:
      summary: 最新 Agent 版本(Agent auto_update 轮询用)
      responses:
        "200":
          description: 最新版本或空仓库
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  latest:
                    type: object
                    properties:
                      version: { type: string }
                      sha256: { type: string }
                      size: { type: integer }

  /api/updates/download:
    get:
      summary: 流式下载指定版本 Agent 二进制
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 二进制流(带 X-Xfer-SHA256 头)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: 版本不在仓库 }

  /api/version:
    get:
      summary: Relay 版本(部署漂移一眼可辨)
      responses:
        "200":
          description: 版本信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  protocol: { type: integer }
                  component: { type: string }

  /api/transfer/direct:
    post:
      summary: 申请内网直连传输票据(Phase1)
      description: |
        Agent 开启 xfer_listen 时,CLI 先经此端点换一次性票据(32B 随机 secret,
        明文只回 CLI,SHA256 hash 经控制 WS 推给 Agent),随后直连 Agent 的
        /xfer/begin|data|fetch 端点传输字节流;Agent 未开启直连时返回
        direct=false,CLI 静默回落中继路径。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string }
                path: { type: string }
                direction: { type: string, enum: [upload, download] }
      responses:
        "200":
          description: 票据或回落信号
          content:
            application/json:
              schema:
                type: object
                properties:
                  direct: { type: boolean }
                  ticket_id: { type: string }
                  secret: { type: string }
                  addrs: { type: array, items: { type: string } }
                  expiry_unix: { type: integer }
        "404": { description: Agent 不在线 }

  /api/tunnel/open:
    post:
      summary: 开启端口转发隧道
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tunnel_id: { type: string }
                agent_id: { type: string }
                target: { type: string }

  /api/power:
    post:
      summary: 电源操作(关机/重启/休眠)
      description: 需 Agent 带 power_allowed=true 标签
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string }
                op: { type: string, enum: [shutdown, restart, sleep, lock] }
                force: { type: boolean }
                delay: { type: integer }

  /api/updates:
    get:
      summary: 列出 Agent 版本仓库
      responses:
        "200": { description: 版本列表 }

  /api/updates/upload:
    post:
      summary: 上传新 Agent 版本到仓库
      parameters:
        - name: version
          in: query
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }

  /api/updates/apply:
    post:
      summary: 触发 Agent 自更新
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, version]
              properties:
                agent_id: { type: string }
                version: { type: string }
                force: { type: boolean }
                binary_path:
                  type: string
                  description: |
                    Agent 侧已预上传的新二进制绝对路径(经 /api/transfer/upload 分片传输)。
                    引用模式零内联——公网链路内联 7MB+ base64 单帧 WS 写必超时。
                    缺省时回退 base64 内联(仅适合小体积/低延迟链路)。
      responses:
        "202":
          description: 更新任务已下发,Agent 将自更新并重启(SCM 拉起)

  /api/batch:
    post:
      summary: 异步批量分发(重试+进度跟踪)
      description: |
        按 tag 匹配目标,经 BatchDispatcher 引擎并发投递(指数退避重试)。
        立即返回 batch_id,进度经 /api/batch/{id} 轮询或 /api/batch/{id}/progress SSE 订阅。
        命令策略校验与单任务同款(批量是策略绕过的高危面)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag, type]
              properties:
                tag: { type: string, description: "目标标签,如 env=prod" }
                type: { type: string }
                payload: { type: object }
                timeout: { type: integer, default: 60 }
                max_retries: { type: integer, default: 0 }
      responses:
        "202":
          description: 批次已提交(异步执行)
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string }
                  total: { type: integer }
                  progress: { type: string, description: SSE 进度端点路径 }
                  max_retries: { type: integer }
        "403": { description: 命令策略拦截 }
        "404": { description: 无匹配标签的在线 Agent }

  /api/batch/{id}:
    get:
      summary: 批次进度快照(轮询用)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            进度快照:status(running|finished)/total/dispatched/succeeded/failed/
            pending/percent/elapsed_ms/eta_ms/states[](各目标状态机)+
            终态附 success_rate(0-1)。
        "404": { description: 批次不存在或已过期(TTL 1h) }

  /api/batch/{id}/progress:
    get:
      summary: 批次进度 SSE 实时流
      description: 每秒推送 event:progress(snapshot);终态推送 event:done(含 success_rate)后关流。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        "404": { description: 批次不存在或已过期 }

  /api/crons:
    get:
      summary: 列出定时任务规则
      responses:
        "200": { description: 规则列表 }
    post:
      summary: 新建定时任务规则
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cron_expr: { type: string }
                agent_id: { type: string }
                task_type: { type: string }
    delete:
      summary: 删除定时任务规则
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已删除 }

  /api/agents/revoke:
    post:
      summary: 撤销 Agent 证书(mTLS)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string }

  /api/tasks/stream:
    post:
      summary: 流式任务(SSE 实时 stdout,非轮询)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskRequest" }
      responses:
        "200":
          description: text/event-stream(task_submitted/task_dispatched/task_progress/task_result 事件)

  /api/enroll-token:
    post:
      summary: 生成一次性 Agent 注册令牌(mTLS 首次注册用,RequireRole 守卫)
      responses:
        "200": { description: 一次性 token }
        "403": { description: 角色无权 }

  /api/enroll:
    post:
      summary: Agent 证书注册(enrollment token 换客户端证书)
      responses:
        "200": { description: 签发的客户端证书 }

  /api/renew:
    post:
      summary: Agent 证书续签
      responses:
        "200": { description: 续签后的证书 }

  /api/shell/open:
    post:
      summary: 打开交互式终端会话(PTY,asciinema v2 录屏归档)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                agent_id: { type: string }
      responses:
        "200": { description: 会话 ID }

  /api/shell/input:
    post:
      summary: 向终端会话写入输入
      responses:
        "200": { description: 已写入 }

  /api/shell/close:
    post:
      summary: 关闭终端会话
      responses:
        "200": { description: 已关闭 }

  /api/tunnel/data:
    post:
      summary: 隧道数据帧(Console→Agent 方向)
      responses:
        "200": { description: 已转发 }

  /api/tunnel/poll:
    get:
      summary: 隧道数据轮询流(Agent→Console 方向,SSE 式流式拉取)
      responses:
        "200": { description: 隧道数据帧流 }

  /api/tunnel/close:
    post:
      summary: 关闭隧道
      responses:
        "200": { description: 已关闭 }

  /api/secrets:
    post:
      summary: 写入 Secret(引用式凭据,TTL+一次性,不落 audit)
      responses:
        "200": { description: secret key }

  /api/secrets/{key}:
    get:
      summary: 读取 Secret(一次性消费)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: secret 值 }
        "404": { description: 不存在或已消费 }
    delete:
      summary: 删除 Secret
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已删除 }

  /api/scripts:
    get:
      summary: 列出脚本库
      responses:
        "200": { description: 脚本列表 }
    post:
      summary: 保存脚本到库(远端存储+复用;名称校验防路径穿越)
      responses:
        "200": { description: 已保存 }

  /api/scripts/{name}:
    get:
      summary: 读取脚本内容
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 脚本内容 }
        "404": { description: 不存在 }
    delete:
      summary: 删除脚本
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 已删除 }

  /api/audit/export:
    get:
      summary: 审计导出(SIEM 格式:CEF/Syslog/JSON)
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [cef, syslog, json] }
      responses:
        "200": { description: 审计流 }

  /api/events:
    get:
      summary: 实时事件流 SSE(agent 上线/任务结果/策略拦截)
      responses:
        "200":
          description: text/event-stream

  /api/metrics:
    get:
      summary: JSON 指标(任务统计/Agent 在线数等)
      responses:
        "200": { description: 指标 JSON }

  /api/scheduler/best:
    get:
      summary: 智能调度:按负载选择最优 Agent(候选列表)
      responses:
        "200": { description: 最优 Agent }

  /api/bootstrap:
    get:
      summary: 生成一行远程部署命令(复制到目标机执行)
      responses:
        "200": { description: bootstrap 命令 }

  /api/tools:
    get:
      summary: 工具发现(AI Agent 用:可用操作清单)
      responses:
        "200": { description: 工具注册表 }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Agent:
      type: object
      properties:
        agent_id: { type: string }
        hostname: { type: string }
        os: { type: string }
        version: { type: string }
        capabilities:
          type: array
          items: { type: string }
        tags:
          type: object
          additionalProperties: { type: string }
        online_since:
          type: integer
          description: 本次注册(上线)的 Unix 毫秒时间戳;0 表示未知
        xfer_stats:
          type: object
          description: 文件传输画像(心跳上报)
          properties:
            upload_bytes: { type: integer }
            download_bytes: { type: integer }
            upload_count: { type: integer }
            download_count: { type: integer }
            failed_count: { type: integer }

    TaskRequest:
      type: object
      properties:
        task_id: { type: string }
        type: { type: string }
        agent_id: { type: string }
        payload: { type: object }
        timeout: { type: integer }
        idempotency_key: { type: string }

    StoredTask:
      type: object
      properties:
        request: { $ref: "#/components/schemas/TaskRequest" }
        status: { type: string }
        attempt: { type: integer }
        created_at: { type: integer }
        updated_at: { type: integer }

    TaskResult:
      type: object
      properties:
        task_id: { type: string }
        success: { type: boolean }
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
        duration_ms: { type: integer }
        error: { type: string }
