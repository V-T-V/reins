# go-rmm Nginx 反向代理配置（https://域名/rmm/ 访问）
#
# 前提：
#   - Relay 运行在 127.0.0.1:7780（不绑外网，只 Nginx 暴露）
#   - Nginx 已配好 HTTPS 证书
#
# 部署步骤：
#   1. Relay 启动：./go-rmm-relay-linux -addr 127.0.0.1:7780
#   2. 把本文件内容加到 Nginx server 块
#   3. nginx -t && nginx -s reload
#   4. Agent 安装：go-rmm-agent.exe install -relay wss://203.0.113.99/rmm/agent
#   5. 浏览器打开 https://203.0.113.99/rmm/

server {
    listen 443 ssl;
    server_name 203.0.113.99;

    # SSL 证书（按实际路径替换）
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;

    # go-rmm 子路径
    location /rmm/ {
        # 关键：尾部斜杠让 Nginx 剥掉 /rmm 前缀
        # 浏览器请求 /rmm/api/agents → Relay 收到 /api/agents
        proxy_pass http://127.0.0.1:7780/;

        # WebSocket 升级（/rmm/agent → Relay /agent）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端 IP（审计用）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WS 长连接：禁用缓冲 + 长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 大文件传输
        client_max_body_size 0;  # 不限制上传大小
    }
}
