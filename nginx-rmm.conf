# go-rmm Nginx 反向代理配置
# 部署地址: https://203.0.113.99/rmm/
#
# 部署步骤:
#   1. Relay 启动: ./go-rmm-relay -addr 127.0.0.1:7780
#   2. 把本配置加到 Nginx server 块(443 SSL)
#   3. nginx -t && nginx -s reload
#   4. Agent 连接: go-rmm-agent run -relay wss://203.0.113.99/rmm/agent
#   5. 浏览器打开: https://203.0.113.99/rmm/
#   6. CLI: go-rmm --relay https://203.0.113.99/rmm agent list

# 在 Nginx 的 server { ... } 块内添加:

    # ─── go-rmm 子路径 ───
    location /rmm/ {
        # 尾部斜杠:剥掉 /rmm 前缀(浏览器请求 /rmm/api/agents → Relay 收到 /api/agents)
        proxy_pass http://127.0.0.1:7780/;

        # WebSocket 升级(Agent 反向连接 /rmm/agent)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接:禁用缓冲 + 超时拉满(SSE/WS/文件传输)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 大文件上传:禁用请求体缓冲(否则 Nginx 先存盘再转发)
        proxy_request_buffering off;
        client_max_body_size 0;
        # R6:慢链路 body 间隔容忍(默认 60s,慢链路传 10MB 分片两次写之间可能超时 → 408)
        client_body_timeout 600s;

        # 流式任务 SSE
        add_header X-Accel-Buffering no always;
    }

    # ─── Prometheus 指标端点(P1 生产硬化:IP 白名单)───
    # /metrics 暴露在线 agent 数/任务量/传输字节,生产应限制访问源。
    # 方案 A(推荐):IP 白名单 + Relay 侧 MetricsToken 双重保护
    # 方案 B:仅靠 Relay MetricsToken(下方 allow/deny 注释掉即可)
    location /rmm/metrics {
        proxy_pass http://127.0.0.1:7780/metrics;
        # IP 白名单(改成你的 Prometheus/内网网段):
        # allow 10.0.0.0/8;
        # allow 192.168.0.0/16;
        # deny all;
        proxy_set_header Host $host;
    }

    # ─── pprof 调试端点(P1 生产硬化:默认 deny)───
    # /debug/pprof 仅排查时临时放开(Relay 默认不注册,需 -debug-pprof 才开)
    location /rmm/debug/ {
        proxy_pass http://127.0.0.1:7780/debug/;
        deny all; # 生产关闭;排查时改 allow <你的 IP>; deny all;
        proxy_set_header Host $host;
    }

# ─── Agent 连接命令(在被控端执行)───
#
# Windows:
#   go-rmm-agent.exe install -relay wss://203.0.113.99/rmm/agent -token <token>
#   go-rmm-agent.exe start
#
# Linux:
#   go-rmm-agent run -relay wss://203.0.113.99/rmm/agent -token <token>
#
# ─── CLI 操作命令 ───
#
#   go-rmm --relay https://203.0.113.99/rmm --token <token> agent list
#   go-rmm --relay https://203.0.113.99/rmm --token <token> task run -a <agent> -c "hostname"
#
# ─── 浏览器 ───
#
#   https://203.0.113.99/rmm/
