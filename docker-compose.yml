# reins 单机一键部署（Relay，可选 Agent）
#
# 快速试用（仅 Relay）：
#   cp .env.example .env && 编辑 REINS_TOKEN
#   docker compose up -d
#   docker compose logs -f relay

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    image: reins-relay:local
    container_name: reins-relay
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-7780}:7780"
    command: ["-addr", ":7780", "-token", "${REINS_TOKEN:?请在 .env 设置 REINS_TOKEN}"]
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7780/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  # Agent 默认不启动（通常部署到外部主机）。
  # 启用：docker compose --profile agent up -d
  agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: reins-agent:local
    container_name: reins-agent
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    command: ["run", "-relay", "ws://relay:7780/agent", "-token", "${REINS_TOKEN:?请在 .env 设置 REINS_TOKEN}"]
    volumes:
      - agent-data:/data
      - agent-workspace:/app/workspace

volumes:
  relay-data:
  agent-data:
  agent-workspace:
