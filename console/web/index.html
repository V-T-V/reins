<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>go-rmm 控制台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  /* 侧栏 */
  .sidebar { background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; }
  .sidebar h2 { padding: 16px; font-size: 15px; color: #58a6ff; border-bottom: 1px solid #30363d; }
  .agent-item { padding: 12px 16px; border-bottom: 1px solid #21262d; cursor: pointer; }
  .agent-item:hover { background: #1f242b; }
  .agent-item.active { background: #1f6feb33; border-left: 3px solid #58a6ff; }
  .agent-id { font-weight: 600; color: #e6edf3; }
  .agent-meta { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .caps { margin-top: 6px; }
  .cap { display: inline-block; background: #238636; color: #fff; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-right: 4px; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fb950; margin-right: 6px; }
  .empty { padding: 40px 16px; text-align: center; color: #6e7681; }

  /* 主区 */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
  .toolbar h1 { font-size: 16px; font-weight: 600; }
  .relay-badge { background: #21262d; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: #8b949e; }

  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; margin-bottom: 20px; }
  .panel-header { padding: 12px 16px; border-bottom: 1px solid #30363d; font-weight: 600; color: #58a6ff; }
  .panel-body { padding: 16px; }

  /* 任务表单 */
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: #8b949e; }
  select, input, textarea { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 8px; border-radius: 4px; font: inherit; }
  textarea { min-height: 120px; font-family: "Cascadia Code", Consolas, monospace; resize: vertical; }
  button { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font: inherit; }
  button:hover { background: #2ea043; }
  button:disabled { background: #21262d; color: #6e7681; cursor: not-allowed; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }

  /* 结果流 */
  .result-item { padding: 12px; border-bottom: 1px solid #21262d; font-family: monospace; font-size: 12px; }
  .result-item .ts { color: #6e7681; }
  .result-item .ok { color: #3fb950; }
  .result-item .fail { color: #f85149; }
  .result-stdout { background: #0d1117; padding: 8px; margin-top: 6px; border-radius: 4px; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .result-img { max-width: 100%; margin-top: 8px; border: 1px solid #30363d; border-radius: 4px; }

  .hint { color: #6e7681; font-size: 12px; margin-top: 8px; }
  /* D6 metrics 面板 */
  .metric { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 8px 12px; min-width: 90px; }
  .metric-label { display: block; font-size: 11px; color: #8b949e; }
  .metric-value { display: block; font-size: 18px; font-weight: 600; color: #e6edf3; margin-top: 2px; }
  .metric-value.ok { color: #3fb950; }
  .metric-value.fail { color: #f85149; }
  /* D6 取消按钮 */
  .cancel-btn { background: #da3633; color: #fff; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; margin-left: 8px; }
  .cancel-btn:hover { background: #f85149; }
  /* P2 安装引导覆盖层 */
  .setup-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(13,17,23,0.95); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
  }
  .setup-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px; max-width: 600px; text-align: center;
  }
  .setup-card h2 { color: var(--accent); border: none; padding: 0; margin-bottom: 8px; }
  .setup-card .step { text-align: left; margin: 20px 0; padding: 16px; background: var(--bg); border-radius: 8px; }
  .setup-card .step-num { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; background: var(--accent); color: #fff; text-align: center; font-weight: 700; margin-right: 12px; }
  .setup-card .cmd { background: #1c2128; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 12px 0; font-family: monospace; font-size: 13px; color: #3fb950; text-align: left; word-break: break-all; cursor: pointer; position: relative; }
  .setup-card .cmd:hover { border-color: var(--accent); }
  .setup-card .copy-hint { position: absolute; right: 12px; top: 12px; color: var(--text-muted); font-size: 11px; }
</style>
</head>
<body>
<!-- P2 安装引导（0 Agent 时显示） -->
<div class="setup-overlay" id="setup-overlay" style="display:none">
  <div class="setup-card">
    <h2>🚀 go-rmm 部署向导</h2>
    <p style="color:#8b949e">还没有 Agent 连接。按以下步骤部署：</p>

    <div class="step">
      <span class="step-num">1</span><strong>在 Windows 被控机器上，管理员 PowerShell 运行：</strong>
      <div class="cmd" onclick="navigator.clipboard.writeText(this.querySelector('code').textContent);this.querySelector('.copy-hint').textContent='已复制!'">
        <code id="install-cmd">go-rmm-agent.exe install -relay <span id="relay-ip">IP</span></code>
        <span class="copy-hint">点击复制</span>
      </div>
    </div>

    <div class="step">
      <span class="step-num">2</span><strong>安装完成后自动启动，刷新本页面即可看到 Agent。</strong>
    </div>

    <div style="margin-top:24px">
      <button onclick="var o=document.getElementById('setup-overlay');o.style.display='none';o.dataset.dismissed='1'">进入控制台</button>
    </div>
  </div>
</div>

<div class="app">
  <!-- 侧栏：Agent 列表 -->
  <aside class="sidebar">
    <h2>在线 Agent (<span id="agent-count">0</span>)</h2>
    <div id="agent-list">
      <div class="empty">等待 Agent 上线...</div>
    </div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <div class="toolbar">
      <h1>go-rmm 控制台</h1>
      <span class="relay-badge" id="relay-info">Relay: 连接中...</span>
    </div>
    <div class="content">
      <!-- 任务下发 -->
      <div class="panel">
        <div class="panel-header">下发任务</div>
        <div class="panel-body" id="task-form-host">
          <div class="empty" id="no-agent-hint">请先在左侧选择一个 Agent</div>
        </div>
      </div>
      <!-- 运行指标 (D6) -->
      <div class="panel">
        <div class="panel-header">运行指标</div>
        <div class="panel-body" id="metrics-panel" style="display:flex;flex-wrap:wrap;gap:16px"></div>
      </div>
      <!-- 实时结果 -->
      <div class="panel">
        <div class="panel-header">实时结果流</div>
        <div class="panel-body" id="result-stream" style="padding:0">
          <div class="empty" style="padding:24px">暂无结果</div>
        </div>
      </div>
      <!-- H5 交互式终端 -->
      <div class="panel">
        <div class="panel-header">交互式终端 <button id="shell-open-btn" onclick="window.__openShell()">打开终端</button></div>
        <div class="panel-body" id="shell-panel" style="padding:0;display:none">
          <div id="terminal" style="background:#0d1117;padding:8px;min-height:300px;font-family:monospace;font-size:13px;color:#c9d1d9"></div>
        </div>
      </div>
      <!-- J3 大文件传输 -->
      <div class="panel">
        <div class="panel-header">大文件传输</div>
        <div class="panel-body">
          <div class="row">
            <div>
              <label>上传到 Agent（绝对路径）</label>
              <input id="xfer-upload-path" placeholder="C:\Users\test\big.bin">
            </div>
          </div>
          <div class="row" style="margin-top:8px">
            <div>
              <label>选择文件</label>
              <input type="file" id="xfer-file-input">
            </div>
            <div>
              <button onclick="window.__uploadFile()" style="margin-top:24px">上传</button>
            </div>
          </div>
          <div class="row" style="margin-top:12px">
            <div>
              <label>从 Agent 下载（绝对路径）</label>
              <input id="xfer-download-path" placeholder="C:\Users\test\report.pdf">
            </div>
            <div>
              <button onclick="window.__downloadFile()" style="margin-top:24px">下载</button>
            </div>
          </div>
          <div id="xfer-progress" style="margin-top:12px"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
