name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # goreleaser 创建/编辑 GitHub Release
  packages: write   # 推送 ghcr.io 镜像

jobs:
  release:
    name: build images + goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser 需要完整历史生成 changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.relay
          push: true
          tags: |
            ghcr.io/v-t-v/go-rmm-relay:latest
            ghcr.io/v-t-v/go-rmm-relay:${{ github.ref_name }}

      - name: Build & push Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: |
            ghcr.io/v-t-v/go-rmm-agent:latest
            ghcr.io/v-t-v/go-rmm-agent:${{ github.ref_name }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
