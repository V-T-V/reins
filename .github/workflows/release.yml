name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.relay
          push: true
          tags: |
            ghcr.io/v-t-v/reins-relay:latest
            ghcr.io/v-t-v/reins-relay:${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          tags: |
            ghcr.io/v-t-v/reins-agent:latest
            ghcr.io/v-t-v/reins-agent:${{ github.ref_name }}

      # SBOM 生成依赖 syft(anchore),runner 默认不带——2026-10-26 v4.8.0 首发干跑补齐
      - name: Install syft (SBOM tooling)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
