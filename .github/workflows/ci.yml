# go-rmm CI/CD
# 世界级 Go 项目的标准 CI 流水线

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 构建 + 静态检查 + 测试
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build all components
        run: |
          go build -ldflags "-X main.version=ci" ./relay/
          go build -ldflags "-X main.version=ci" ./agent/
          go build -ldflags "-X main.version=ci" ./cmd/go-rmm/

      - name: Vet
        run: go vet ./...

      - name: Test (with coverage)
        run: go test -cover -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # 交叉编译验证(确保多平台可构建)
  cross-compile:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cross-compile Relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X main.version=ci-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -o go-rmm-relay-${{ matrix.goos }}-${{ matrix.goarch }} ./relay/
      - name: Cross-compile Agent (Windows only for service)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X main.version=ci-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -o go-rmm-agent-${{ matrix.goos }}-${{ matrix.goarch }}.exe ./agent/
