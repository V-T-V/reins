name: go-rmm-local
description: go-rmm 控制台 E2E 本地环境（relay 走标准 PORT 隔离；agent 前台连接；GO_RMM_E2E_TOKEN 为本 suite 自生成的 loopback 测试 token，非任何真实凭证）
variables:
  GO_RMM_ROOT: "D:/M_X_M/ai-agent-platform/go-rmm"
  GO_RMM_RELAY_BIN: "D:/M_X_M/ai-agent-platform/go-rmm/bin/e2e/relay.exe"
  GO_RMM_AGENT_BIN: "D:/M_X_M/ai-agent-platform/go-rmm/bin/e2e/agent.exe"
  GO_RMM_GENCERT_BIN: "D:/M_X_M/ai-agent-platform/go-rmm/bin/e2e/gencert.exe"
  # 本 suite 专用一次性测试 token（≥8 字符），随 relay -token 传入、随 URL 引导消费——用后即弃
  GO_RMM_E2E_TOKEN: "e2e-tok-gormm-console-2026"
